[project]
name = "cognee-de-lab"
version = "0.1.0"
description = "Cognee Data Engineering Lab: the Airflow and DataHub connectors for cognee, in one local app"
requires-python = ">=3.11,<3.14"
dependencies = [
    "cognee==1.6.5",
    "cognee-community-connector-airflow",
    "cognee-community-connector-datahub",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[tool.uv.sources]
cognee-community-connector-airflow = { path = "../../connectors/airflow", editable = true }
cognee-community-connector-datahub = { path = "../../connectors/datahub", editable = true }

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lab"]

[tool.ruff]
line-length = 100
target-version = "py311"
